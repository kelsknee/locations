<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Pin Logger</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --ink:#1b2329; --paper:#f6f5f1; --line:#d9d6cc; --muted:#5e6a72;
    --brush:#2e7d4f; --trash:#d9822b; --tires:#2b2f36; --go:#1b2329;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper);
    display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
  #map{flex:1 1 auto;min-height:0;background:#e6e3da}
  .panel{flex:0 0 auto;background:var(--paper);border-top:1px solid var(--line);
    padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));max-height:52vh;display:flex;flex-direction:column;gap:10px}
  .types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .type{appearance:none;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;
    font:600 15px/1.1 inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
  .type svg{width:30px;height:30px}
  .type[aria-pressed="true"]{color:#fff;border-color:transparent}
  .type[data-t="brush"][aria-pressed="true"]{background:var(--brush)}
  .type[data-t="trash"][aria-pressed="true"]{background:var(--trash)}
  .type[data-t="tires"][aria-pressed="true"]{background:var(--tires)}
  .type:focus-visible,.go:focus-visible,.btn:focus-visible{outline:3px solid #2b6cb0;outline-offset:2px}
  .go{appearance:none;border:0;border-radius:14px;background:var(--go);color:#fff;font:700 19px/1 inherit;
    padding:17px;width:100%;cursor:pointer}
  .go:disabled{opacity:.55}
  .status{font-size:13px;color:var(--muted);min-height:18px}
  .status.warn{color:#a4510a}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .counts{font-size:14px;font-weight:600}
  .actions{display:flex;gap:6px}
  .btn{appearance:none;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;
    padding:8px 12px;font:600 14px/1 inherit;cursor:pointer}
  .btn.solid{background:var(--ink);color:#fff}
  .btn.quiet{border-color:var(--line);color:var(--muted)}
  ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1 1 auto;min-height:0;border-top:1px solid var(--line)}
  li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
  li .dot{flex:0 0 14px;height:14px;border-radius:50%}
  li .txt{flex:1 1 auto;min-width:0}
  li .addr{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li .meta{font-size:12px;color:var(--muted)}
  li button{appearance:none;border:0;background:none;color:var(--muted);font-size:20px;padding:4px 8px;cursor:pointer}
  .empty{padding:14px 2px;font-size:14px;color:var(--muted)}
  .pin{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
  .pin svg{transform:rotate(45deg);width:16px;height:16px}
  .me{width:16px;height:16px;border-radius:50%;background:#2b6cb0;border:3px solid #fff;box-shadow:0 0 0 2px rgba(43,108,176,.35)}
  .snaprow{display:flex;align-items:center;gap:8px}
  .snaprow .btn{display:inline-flex;align-items:center;gap:6px}
  .snaprow svg{width:18px;height:18px}
  .snaprow img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .snaprow .hint{font-size:13px;color:var(--muted)}
  li .thumb{flex:0 0 44px;width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:pointer;padding:0;background:#fff}
  li .thumb.none{display:flex;align-items:center;justify-content:center;color:var(--muted);border-style:dashed}
  li .thumb svg{width:20px;height:20px}
  .popimg{display:block;width:200px;max-width:100%;border-radius:6px;margin-top:6px}
  .trackrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn.rec[aria-pressed="true"]{background:#c0392b;border-color:#c0392b;color:#fff}
  .trackrow .info{font-size:13px;color:var(--muted);flex:1 1 auto;min-width:90px}
  li .meta button.lnk{font:inherit;font-weight:600;color:#2b6cb0;text-decoration:underline;padding:0;border:0;background:none;cursor:pointer;font-size:12px}
  .locate{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--muted);
    border:2px solid rgba(0,0,0,.25);border-radius:6px;cursor:pointer;padding:0}
  .locate svg{width:24px;height:24px}
  .locate[aria-pressed="true"]{color:#2b6cb0}
  .gorow{display:flex;gap:8px}
  .gorow .go{flex:1 1 auto;width:auto}
  .undo{flex:0 0 auto;padding:0 14px;border-radius:14px}
  .undo:disabled{opacity:.4}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;
    padding:max(24px,env(safe-area-inset-top,0px)) 16px 16px;z-index:5000}
  .modal .card{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:340px;margin-top:12vh;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .modal h2{margin:0 0 4px;font-size:18px}
  .modal p{margin:0 0 12px;font-size:14px;color:var(--muted)}
  .modal input{width:100%;font-family:inherit;font-weight:700;font-size:28px;line-height:1;text-align:center;padding:12px;border:2px solid var(--ink);border-radius:12px;color:var(--ink)}
  .modal input:focus-visible{outline:3px solid #2b6cb0;outline-offset:2px}
  .modal .err{color:#a4510a;font-size:13px;min-height:18px;margin-top:6px}
  .modal .row{display:flex;gap:8px;margin-top:6px}
  .modal .row .btn{flex:1 1 0;padding:14px 6px;font-size:15px}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:no-preference){.type{transition:background .12s}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of logged pins"></div>

<section class="panel">
  <div class="types" role="group" aria-label="Pin type">
    <button class="type" data-t="brush" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 21c0-6 1-10 3-14M12 21V4M19 21c0-6-1-10-3-14"/></svg>Brush</button>
    <button class="type" data-t="trash" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/></svg>Trash</button>
    <button class="type" data-t="tires" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></svg>Tires</button>
  </div>

  <div class="trackrow">
    <button id="track" class="btn rec" type="button" aria-pressed="false">Start tracking drive</button>
    <span id="trackinfo" class="info">No route yet.</span>
    <button id="gpx" class="btn quiet" type="button" hidden>GPX</button>
    <button id="cleartrack" class="btn quiet" type="button" hidden>Clear route</button>
  </div>

  <div class="snaprow">
    <button id="snap" class="btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Take photo</button>
    <img id="stage" alt="Photo that will be attached to the next pin" hidden>
    <button id="unstage" class="btn quiet" type="button" hidden>Remove</button>
    <span id="snaphint" class="hint">Optional. Attaches to the next pin.</span>
    <input id="file" type="file" accept="image/*" capture="environment" hidden>
  </div>

  <div class="gorow">
    <button id="go" class="go">Log pin at my location</button>
    <button id="undo" class="btn undo" type="button" disabled aria-label="Remove the last pin">Undo last</button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite">Waiting for GPS…</div>

  <div class="bar">
    <div id="counts" class="counts">0 pins</div>
    <div class="actions">
      <button id="copy" class="btn">Copy addresses</button>
      <button id="csv" class="btn solid">Export CSV</button>
      <button id="zip" class="btn">Photos ZIP</button>
      <button id="clear" class="btn quiet">Clear</button>
    </div>
  </div>
  <ul id="list" aria-label="Logged pins"></ul>
</section>

<div id="countModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="cmTitle">
  <form class="card" id="cmForm" autocomplete="off" novalidate>
    <h2 id="cmTitle">How many tires?</h2>
    <p>Count the tires in this pile.</p>
    <input id="cmInput" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" maxlength="5" aria-label="Number of tires" autocomplete="off">
    <div id="cmErr" class="err" role="alert"></div>
    <div class="row">
      <button type="button" class="btn quiet" id="cmCancel">Cancel</button>
      <button type="button" class="btn" id="cmUnknown">Not sure</button>
      <button type="submit" class="btn solid">Save</button>
    </div>
  </form>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var TYPES = {
    brush:{label:"Brush",color:"#2e7d4f",svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 21c0-6 1-10 3-14M12 21V4M19 21c0-6-1-10-3-14"/></svg>'},
    trash:{label:"Trash",color:"#d9822b",svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>'},
    tires:{label:"Tires",color:"#2b2f36",svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>'}
  };
  var KEY = "sitePinLogger.v1";
  var CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

  // Photo storage (IndexedDB, keyed by pin id). Pins in localStorage just hold hasPhoto.
  var dbp = new Promise(function(res){
    try {
      var rq = indexedDB.open("sitePinLogger",1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore("photos"); };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror = function(){ res(null); };
    } catch(e){ res(null); }
  });
  function tx(mode,fn){
    return dbp.then(function(db){
      if (!db) return null;
      return new Promise(function(res){
        var t = db.transaction("photos",mode), r = fn(t.objectStore("photos"));
        t.oncomplete = function(){ res(r && r.result!==undefined ? r.result : true); };
        t.onerror = t.onabort = function(){ res(null); };
      });
    });
  }
  var photoURLs = {};
  function putPhoto(id,blob){ return tx("readwrite",function(s){ return s.put(blob,id); }).then(function(ok){
    if (!ok) return false;
    if (photoURLs[id]) URL.revokeObjectURL(photoURLs[id]);
    photoURLs[id] = URL.createObjectURL(blob); return true; }); }
  function getPhoto(id){ return tx("readonly",function(s){ return s.get(id); }); }
  function delPhoto(id){
    if (photoURLs[id]){ URL.revokeObjectURL(photoURLs[id]); delete photoURLs[id]; }
    return tx("readwrite",function(s){ return s.delete(id); });
  }
  function clearPhotos(){
    Object.keys(photoURLs).forEach(function(k){ URL.revokeObjectURL(photoURLs[k]); }); photoURLs = {};
    return tx("readwrite",function(s){ return s.clear(); });
  }
  // Shrink phone photos (often 4-12 MB) to ~1600px JPEG so dozens of pins fit.
  function shrink(file){
    return new Promise(function(res,rej){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        var k = Math.min(1, 1600/Math.max(img.naturalWidth,img.naturalHeight));
        var c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){ b ? res(b) : rej(); },"image/jpeg",0.82);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); rej(); };
      img.src = url;
    });
  }
  var pins = [];
  var current = "brush";
  var lastFix = null;

  try { pins = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){ pins = []; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(pins)); } catch(e){} }

  var map = L.map("map",{zoomControl:true}).setView([42.3314,-83.0458],13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);

  // Follow mode: the map keeps your location in view. Dragging the map or opening a pin pauses it.
  var follow = true;
  var LocateCtl = L.Control.extend({options:{position:"topright"},onAdd:function(){
    var b = L.DomUtil.create("button","locate");
    b.type = "button"; b.setAttribute("aria-label","Center map on my location and follow me");
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>';
    L.DomEvent.disableClickPropagation(b);
    b.addEventListener("click",function(){
      follow = true; setFollowUI();
      if (lastFix) map.setView([lastFix.coords.latitude,lastFix.coords.longitude],Math.max(map.getZoom(),17));
    });
    this._b = b; return b;
  }});
  var locateCtl = new LocateCtl().addTo(map);
  function setFollowUI(){ locateCtl._b.setAttribute("aria-pressed",follow?"true":"false"); }
  setFollowUI();
  map.on("dragstart popupopen",function(){ follow = false; setFollowUI(); });

  var markers = {};
  var meMarker = null, meCircle = null;

  function pinIcon(t){
    return L.divIcon({className:"",iconSize:[32,32],iconAnchor:[16,32],
      html:'<div class="pin" style="background:'+TYPES[t].color+'">'+TYPES[t].svg+'</div>'});
  }
  function addMarker(p){
    var m = L.marker([p.lat,p.lng],{icon:pinIcon(p.type)}).addTo(map);
    m.bindPopup(function(){ return "<b>"+TYPES[p.type].label+(p.type==="tires"?" ("+countLabel(p)+")":"")+"</b><br>"+esc(p.address||fmtCoord(p))+
      (photoURLs[p.id]?'<img class="popimg" alt="Photo of this pin" src="'+photoURLs[p.id]+'">':""); });
    markers[p.id] = m;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function fmtCoord(p){ return p.lat.toFixed(6)+", "+p.lng.toFixed(6); }

  // Live location
  var statusEl = document.getElementById("status");
  function setStatus(msg,warn){ statusEl.textContent = msg; statusEl.className = "status"+(warn?" warn":""); }

  if (!("geolocation" in navigator)) {
    setStatus("This browser has no location access.",true);
    document.getElementById("go").disabled = true;
  } else {
    var first = true;
    navigator.geolocation.watchPosition(function(pos){
      lastFix = pos;
      onFix(pos);
      if (waitingFix) waitingFix(pos);
      var ll = [pos.coords.latitude,pos.coords.longitude];
      if (!meMarker){
        meMarker = L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]}),interactive:false,zIndexOffset:-100}).addTo(map);
        meCircle = L.circle(ll,{radius:pos.coords.accuracy,color:"#2b6cb0",weight:1,fillOpacity:.08,interactive:false}).addTo(map);
      } else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(pos.coords.accuracy); }
      if (first){ map.setView(ll,18); first = false; }
      else if (follow && map.latLngToContainerPoint(ll).distanceTo(map.getSize().divideBy(2)) > 40) map.panTo(ll,{animate:true,duration:.5});
      var a = Math.round(pos.coords.accuracy);
      if (!waitingFix && Date.now()>holdStatus) setStatus("GPS ready, accurate to about "+a+" m"+(a>30?". Move into the open for a better fix.":"."), a>30);
    },function(err){
      setStatus(err.code===1?"Location is blocked. Allow location for this site in your browser settings.":"Can't get a GPS fix yet.",true);
    },{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  }

  // Drive tracking: records the route as line segments (a new segment each time tracking starts)
  var TKEY = "sitePinLogger.track.v1";
  var track = {on:false,segs:[]};
  try { var t0 = JSON.parse(localStorage.getItem(TKEY)||"null"); if (t0 && t0.segs) track = t0; } catch(e){}
  function saveTrack(){ try { localStorage.setItem(TKEY,JSON.stringify(track)); } catch(e){} }
  var trackLine = L.polyline(track.segs.map(function(sg){return sg.map(function(q){return [q[0],q[1]];});}),
    {color:"#2b6cb0",weight:5,opacity:.8,lineJoin:"round",interactive:false}).addTo(map);
  var trackBtn = document.getElementById("track"), trackInfo = document.getElementById("trackinfo");
  function dist(a,b){ // metres, haversine
    var R=6371000,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;
    var h=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)*Math.sin(dn/2);
    return 2*R*Math.asin(Math.sqrt(h));
  }
  function trackMeters(){
    var m=0; track.segs.forEach(function(sg){ for(var i=1;i<sg.length;i++) m+=dist(sg[i-1],sg[i]); }); return m;
  }
  function renderTrack(){
    var n = track.segs.reduce(function(a,sg){return a+sg.length;},0);
    trackBtn.setAttribute("aria-pressed",track.on?"true":"false");
    trackBtn.textContent = track.on ? "Stop tracking" : (n ? "Resume tracking" : "Start tracking drive");
    trackInfo.textContent = track.on || n ? (trackMeters()/1609.344).toFixed(2)+" mi driven"+(track.on?" · recording":"") : "No route yet.";
    document.getElementById("gpx").hidden = document.getElementById("cleartrack").hidden = !n;
    trackLine.setLatLngs(track.segs.map(function(sg){return sg.map(function(q){return [q[0],q[1]];});}));
  }
  function onFix(pos){
    if (!track || !track.on) return;
    if (pos.coords.accuracy > 50) return;               // ignore poor fixes so the line doesn't jump
    var sg = track.segs[track.segs.length-1];
    if (!sg){ sg = []; track.segs.push(sg); }
    var q = [+pos.coords.latitude.toFixed(6),+pos.coords.longitude.toFixed(6),pos.timestamp||Date.now()];
    var last = sg[sg.length-1];
    if (last && dist(last,q) < Math.max(5, Math.min(pos.coords.accuracy,15)/2)) return; // skip standing still / GPS drift
    sg.push(q); saveTrack(); renderTrack();
  }
  var wake = null;
  function holdScreen(){
    if (!track.on || !navigator.wakeLock || wake) return;
    navigator.wakeLock.request("screen").then(function(w){ wake = w; w.addEventListener("release",function(){ wake = null; }); },function(){});
  }
  document.addEventListener("visibilitychange",function(){ if (!document.hidden) holdScreen(); });
  trackBtn.addEventListener("click",function(){
    track.on = !track.on;
    if (track.on){
      track.segs.push([]);
      if (lastFix) onFix(lastFix);
      holdScreen();
      setStatus("Tracking your drive. Keep this page open and the screen on, or your phone may pause GPS.");
    } else {
      if (wake){ wake.release(); wake = null; }
      track.segs = track.segs.filter(function(sg){return sg.length;});
      setStatus("Tracking stopped.");
    }
    saveTrack(); renderTrack();
    if (track.on) trackBtn.blur();
  });
  document.getElementById("cleartrack").addEventListener("click",function(){
    if (confirm("Delete the recorded route? Export the GPX first if you need it.")){
      track = {on:false,segs:[]}; if (wake){ wake.release(); wake = null; } saveTrack(); renderTrack();
    }
  });
  document.getElementById("gpx").addEventListener("click",function(){
    var x = '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Site Pin Logger" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Drive '+new Date().toISOString().slice(0,10)+'</name>';
    track.segs.forEach(function(sg){
      x += "<trkseg>"+sg.map(function(q){ return '<trkpt lat="'+q[0]+'" lon="'+q[1]+'"><time>'+new Date(q[2]).toISOString()+'</time></trkpt>'; }).join("")+"</trkseg>";
    });
    x += "</trk></gpx>";
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([x],{type:"application/gpx+xml"}));
    a.download = "drive-"+new Date().toISOString().slice(0,10)+".gpx";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
  });
  function fitAll(){
    var pts = []; track.segs.forEach(function(sg){ sg.forEach(function(q){ pts.push([q[0],q[1]]); }); });
    pins.forEach(function(p){ pts.push([p.lat,p.lng]); });
    return pts;
  }

  // Type picker
  var typeBtns = document.querySelectorAll(".type");
  typeBtns.forEach(function(b){
    b.addEventListener("click",function(){
      current = b.dataset.t;
      typeBtns.forEach(function(x){ x.setAttribute("aria-pressed", x===b ? "true":"false"); });
    });
  });

  // Reverse geocode (queued, 1 request/sec per Nominatim policy)
  var queue = [], working = false;
  function geocode(p){
    if (queue.indexOf(p.id)===-1) queue.push(p.id);
    if (!working) runQueue();
  }
  function runQueue(){
    working = true;
    var id = queue.shift();
    var p = pins.filter(function(x){return x.id===id;})[0];
    if (!p){ working = queue.length>0; if (working) runQueue(); return; }
    fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&lat="+p.lat+"&lon="+p.lng,{headers:{"Accept":"application/json"}})
      .then(function(r){ if(!r.ok) throw new Error("http"); return r.json(); })
      .then(function(j){
        var a = j.address || {};
        var street = [a.house_number,a.road].filter(Boolean).join(" ");
        var city = a.city||a.town||a.village||a.hamlet||"";
        var place = street||a.neighbourhood||a.suburb||"";
        if (!p.edited){
          if (a.house_number){ p.addrKind = "Exact"; }
          else { p.addrKind = "Nearest"; if (a.road) place = "Near "+a.road; else if (place) place = "Near "+place; }
          var line = [place, city, a.state, a.postcode].filter(Boolean);
          p.address = line.length ? line.join(", ") : "";
          if (!p.address){ p.addrKind = "None"; }
        }
        p.addrPending = false; save(); render();
      })
      .catch(function(){ p.addrPending = true; save(); render(); })
      .then(function(){
        setTimeout(function(){ if (queue.length) runQueue(); else working = false; },1100);
      });
  }

  // Photo capture: take one before logging (attaches to the next pin), or add/replace on an existing pin
  var fileEl = document.getElementById("file"), stageEl = document.getElementById("stage");
  var staged = null, stagedURL = null, targetId = null;
  function showStage(){
    if (stagedURL){ URL.revokeObjectURL(stagedURL); stagedURL = null; }
    if (staged){ stagedURL = URL.createObjectURL(staged); stageEl.src = stagedURL; }
    stageEl.hidden = !staged;
    document.getElementById("unstage").hidden = !staged;
    document.getElementById("snaphint").hidden = !!staged;
  }
  document.getElementById("snap").addEventListener("click",function(){ targetId = null; fileEl.value = ""; fileEl.click(); });
  document.getElementById("unstage").addEventListener("click",function(){ staged = null; showStage(); });
  fileEl.addEventListener("change",function(){
    var f = fileEl.files && fileEl.files[0], id = targetId; targetId = null;
    if (!f) return;
    setStatus("Processing photo…");
    shrink(f).then(function(b){
      if (!id){ staged = b; showStage(); setStatus("Photo ready. It will attach to the next pin you log."); return; }
      var p = pins.filter(function(x){return x.id===id;})[0];
      if (!p) return;
      return putPhoto(id,b).then(function(ok){
        if (!ok){ setStatus("Couldn't store the photo on this device.",true); return; }
        p.hasPhoto = true; save(); render(); setStatus("Photo saved to that pin.");
      });
    },function(){ setStatus("Couldn't read that photo.",true); });
  });

  // Tire piles: ask how many with a number-pad dialog. cb gets null (cancelled), "" (not sure) or a whole number.
  // Must be called straight from a tap so the phone opens the keypad.
  var cm = document.getElementById("countModal"), cmInput = document.getElementById("cmInput"), cmErr = document.getElementById("cmErr");
  var cmDone = null;
  function askCount(def,cb){
    cmDone = function(v){ cm.hidden = true; cmDone = null; cb(v); };
    cmInput.value = def==null||def==="" ? "" : String(def);
    cmErr.textContent = ""; cm.hidden = false;
    cmInput.focus(); cmInput.select();
  }
  document.getElementById("cmForm").addEventListener("submit",function(e){
    e.preventDefault();
    var v = cmInput.value.trim();
    if (v === ""){ cmErr.textContent = "Enter a number, or tap Not sure."; return; }
    if (!/^\d{1,5}$/.test(v)){ cmErr.textContent = "Numbers only, like 12."; return; }
    cmDone && cmDone(parseInt(v,10));
  });
  document.getElementById("cmUnknown").addEventListener("click",function(){ cmDone && cmDone(""); });
  document.getElementById("cmCancel").addEventListener("click",function(){ cmDone && cmDone(null); });
  document.addEventListener("keydown",function(e){ if (e.key==="Escape" && !cm.hidden && cmDone) cmDone(null); });
  function countLabel(p){ return p.type==="tires" ? (p.count===""||p.count==null ? "count unknown" : p.count+(p.count===1?" tire":" tires")) : ""; }

  // Log a pin
  var holdStatus = 0, waitingFix = null, MAX_ACC = 20; // metres: pins must be at least this accurate
  var goBtn = document.getElementById("go");
  goBtn.addEventListener("click",function(){
    var type = current;
    if (type === "tires"){
      askCount(null,function(count){
        if (count === null){ setStatus("Cancelled. No pin logged."); return; }
        startLog(type,count);
      });
    } else startLog(type,null);
  });
  function startLog(type,count){
    goBtn.disabled = true; goBtn.textContent = "Getting exact location…";
    var finished = false, timer = null;
    function done(){ finished = true; waitingFix = null; clearTimeout(timer); goBtn.disabled = false; goBtn.textContent = "Log pin at my location"; }
    function fail(msg){ if (finished) return; setStatus(msg,true); holdStatus = Date.now()+15000; done(); }
    function log(pos){
      if (finished) return;
      try {
        var p = {id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),
          type:type,lat:pos.coords.latitude,lng:pos.coords.longitude,
          acc:Math.round(pos.coords.accuracy),time:new Date().toISOString(),address:"",addrPending:true};
        if (type === "tires") p.count = count;
        var shot = staged; staged = null; showStage();
        if (shot){ p.hasPhoto = true; putPhoto(p.id,shot).then(function(ok){
          if (!ok){ p.hasPhoto = false; save(); setStatus("Pin saved, but the photo couldn't be stored.",true); }
          render(); }); }
        pins.push(p); save(); addMarker(p); map.panTo([p.lat,p.lng]); render(); geocode(p);
        if (navigator.vibrate) navigator.vibrate(40);
        setStatus("Pin logged.");
      } catch(e){ setStatus("Something went wrong saving that pin. Try again.",true); }
      done();
    }
    // Only ever log a fix taken after the tap: a live fix from the last 3 s, else the next fix
    // that arrives (from the continuous GPS watch or a fresh request). Never reuse an old location.
    var tapped = Date.now();
    var best = null;
    function fresh(pos){ return pos && pos.timestamp >= tapped-3000; }
    function good(pos){ return fresh(pos) && pos.coords.accuracy <= MAX_ACC; }
    function take(pos){
      if (!fresh(pos)) return;
      if (!best || pos.coords.accuracy < best) best = pos.coords.accuracy;
      if (!good(pos)){ setStatus("Waiting for a more accurate GPS fix (now ±"+Math.round(pos.coords.accuracy)+" m, need ±"+MAX_ACC+" m or better)…",true); return; }
      waitingFix = null; log(pos);
    }
    if (good(lastFix)){ log(lastFix); return; }
    waitingFix = take;
    timer = setTimeout(function(){
      waitingFix = null;
      fail(best ? "Nothing logged: GPS was only accurate to ±"+Math.round(best)+" m (need ±"+MAX_ACC+" m or better). Move into the open and tap again."
                : "No fresh GPS fix yet, so nothing was logged. Move into the open and tap again.");
    },25000);
    navigator.geolocation.getCurrentPosition(take,function(err){
      if (err.code!==1) return; // a timeout here is fine; the live GPS watch and the 25 s limit decide
      waitingFix = null;
      fail(err.code===1?"Location is blocked. Allow location for this site.":"Couldn't get your location. Try again in a moment.");
    },{enableHighAccuracy:true,maximumAge:0,timeout:25000});
  }

  // List
  var listEl = document.getElementById("list"), countsEl = document.getElementById("counts");
  function render(){
    var c = {brush:0,trash:0,tires:0}, tireTotal = 0;
    pins.forEach(function(p){ c[p.type]++; if (p.type==="tires" && p.count) tireTotal += p.count; });
    document.getElementById("undo").disabled = !pins.length;
    countsEl.textContent = pins.length+" pin"+(pins.length===1?"":"s")+
      (pins.length?" · Brush "+c.brush+" · Trash "+c.trash+" · Tires "+c.tires+(tireTotal?" ("+tireTotal+" total)":""):"");
    if (!pins.length){ listEl.innerHTML = '<li class="empty">No pins yet. Pick a type, then tap Log pin.</li>'; return; }
    listEl.innerHTML = pins.slice().reverse().map(function(p){
      var t = new Date(p.time).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
      var th = photoURLs[p.id]
        ? '<img class="thumb" alt="Photo. Tap to view." data-view="'+p.id+'" src="'+photoURLs[p.id]+'">'
        : '<button class="thumb none" aria-label="Add photo" data-photo="'+p.id+'">'+CAM+'</button>';
      return '<li data-id="'+p.id+'">'+th+'<span class="dot" style="background:'+TYPES[p.type].color+'"></span>'+
        '<div class="txt"><div class="addr">'+esc(p.address||(p.addrPending?"Finding address…":fmtCoord(p)))+'</div>'+
        '<div class="meta">'+TYPES[p.type].label+(p.type==="tires"?' · <button class="lnk" data-count="'+p.id+'" aria-label="Edit tire count">'+countLabel(p)+'</button>':'')+' · '+t+' · '+(p.acc>MAX_ACC?'<b style="color:#a4510a">±'+p.acc+' m, weak GPS: recheck</b>':'±'+p.acc+' m')+'</div>'+
        '<div class="meta">'+fmtCoord(p)+(p.addrKind==="Nearest"?" · no street number":"")+'</div></div>'+
        '<button aria-label="Replace photo" data-photo="'+p.id+'"'+(photoURLs[p.id]?'':' hidden')+'>'+CAM+'</button>'+
        '<button aria-label="Edit address" data-edit="'+p.id+'">&#9998;</button>'+
        '<button aria-label="Delete pin" data-del="'+p.id+'">&times;</button></li>';
    }).join("");
  }
  function removePin(id){
    delPhoto(id);
    pins = pins.filter(function(p){return p.id!==id;});
    if (markers[id]){ map.removeLayer(markers[id]); delete markers[id]; }
    save(); render();
  }
  document.getElementById("undo").addEventListener("click",function(){
    var p = pins[pins.length-1];
    if (!p) return;
    var t = new Date(p.time).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
    if (confirm("Remove the last pin?\n\n"+TYPES[p.type].label+(p.type==="tires"?" ("+countLabel(p)+")":"")+" at "+t+(p.address?"\n"+p.address:"")+(p.hasPhoto?"\n(its photo will be removed too)":""))){
      removePin(p.id); setStatus("Removed the last pin.");
    }
  });
  listEl.addEventListener("click",function(e){
    var eid = e.target.getAttribute("data-edit");
    if (eid){
      var ep = pins.filter(function(p){return p.id===eid;})[0];
      var v = window.prompt("Address or landmark for this pin (e.g. \"I-94 service drive, east of Conant\"):", ep.address||"");
      if (v !== null){ ep.address = v.trim(); ep.edited = !!ep.address; ep.addrKind = ep.address ? "Edited" : "None"; save(); render(); }
      return;
    }
    var cid = e.target.getAttribute("data-count");
    if (cid){
      var cp = pins.filter(function(p){return p.id===cid;})[0];
      askCount(cp.count,function(nv){ if (nv !== null){ cp.count = nv; save(); render(); } });
      return;
    }
    var btn = e.target.closest("[data-photo]");
    if (btn){ targetId = btn.getAttribute("data-photo"); fileEl.value = ""; fileEl.click(); return; }
    var vid = e.target.getAttribute("data-view");
    if (vid){ window.open(photoURLs[vid],"_blank"); return; }
    var id = e.target.getAttribute("data-del");
    if (id){ removePin(id); return; }
    var li = e.target.closest("li[data-id]");
    if (li && markers[li.dataset.id]){ var m = markers[li.dataset.id]; map.setView(m.getLatLng(),18); m.openPopup(); }
  });

  // Export
  function csvCell(v){ v = String(v==null?"":v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
  function photoName(p,i){ return "photos/"+String(i+1).padStart(3,"0")+"-"+p.type+".jpg"; }
  function buildCsv(){
    var rows = [["Type","Address","Address quality","Latitude","Longitude","Accuracy (m)","Logged at","Map link","Photo file","Tire count"]];
    pins.forEach(function(p,i){ rows.push([TYPES[p.type].label,p.address||"",p.addrKind||(p.address?"":"None"),p.lat.toFixed(6),p.lng.toFixed(6),p.acc,p.time,"https://www.google.com/maps?q="+p.lat.toFixed(6)+","+p.lng.toFixed(6),p.hasPhoto?photoName(p,i):"",p.type==="tires"&&p.count!==""&&p.count!=null?p.count:""]); });
    return "\ufeff"+rows.map(function(r){return r.map(csvCell).join(",");}).join("\r\n");
  }
  function download(blob,name){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
  }
  var today = function(){ return new Date().toISOString().slice(0,10); };
  document.getElementById("csv").addEventListener("click",function(){
    if (!pins.length){ setStatus("Log at least one pin first.",true); return; }
    download(new Blob([buildCsv()],{type:"text/csv;charset=utf-8"}),"site-pins-"+today()+".csv");
    setStatus("Exported "+pins.length+" pins. Every row has lat/long and a map link, even where there's no street address. Use Photos ZIP to get the photos.");
  });

  // Minimal ZIP writer (stored, no compression; JPEGs are already compressed)
  var crcT = (function(){ var t=[],c,n,k; for(n=0;n<256;n++){ c=n; for(k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
  function crc32(u8){ var c=0xFFFFFFFF; for(var i=0;i<u8.length;i++) c = crcT[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
  function makeZip(files){ // [{name, data:Uint8Array}]
    var enc = new TextEncoder(), parts = [], central = [], off = 0, d = new Date();
    var dt = ((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(), tm = (d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
    files.forEach(function(f){
      var nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
      var h = new DataView(new ArrayBuffer(30));
      h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
      h.setUint16(10,tm,true); h.setUint16(12,dt,true); h.setUint32(14,crc,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true);
      h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
      c.setUint16(12,tm,true); c.setUint16(14,dt,true); c.setUint32(16,crc,true); c.setUint32(20,sz,true); c.setUint32(24,sz,true);
      c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
      parts.push(h.buffer,nm,f.data); central.push(c.buffer,nm);
      off += 30+nm.length+sz;
    });
    var csz = central.reduce(function(a,b){ return a+(b.byteLength||b.length); },0);
    var e = new DataView(new ArrayBuffer(22));
    e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
    e.setUint32(12,csz,true); e.setUint32(16,off,true);
    return new Blob(parts.concat(central,[e.buffer]),{type:"application/zip"});
  }
  document.getElementById("zip").addEventListener("click",function(){
    if (!pins.length){ setStatus("Log at least one pin first.",true); return; }
    setStatus("Building ZIP…");
    var withPhoto = pins.map(function(p,i){ return {p:p,i:i}; }).filter(function(x){ return x.p.hasPhoto; });
    Promise.all(withPhoto.map(function(x){
      return getPhoto(x.p.id).then(function(b){ return b && b.arrayBuffer ? b.arrayBuffer() : null; })
        .then(function(buf){ return buf ? {name:photoName(x.p,x.i),data:new Uint8Array(buf)} : null; });
    })).then(function(list){
      var files = list.filter(Boolean);
      files.unshift({name:"site-pins.csv",data:new TextEncoder().encode(buildCsv())});
      download(makeZip(files),"site-pins-"+today()+".zip");
      setStatus("Exported ZIP with "+pins.length+" pins and "+(files.length-1)+" photos.");
    });
  });
  document.getElementById("copy").addEventListener("click",function(){
    if (!pins.length){ setStatus("Log at least one pin first.",true); return; }
    var text = pins.map(function(p){ return TYPES[p.type].label+(p.type==="tires"?" ("+countLabel(p)+")":"")+": "+(p.address?p.address+" ("+fmtCoord(p)+")":fmtCoord(p)); }).join("\n");
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function(){
      setStatus("Copied "+pins.length+" addresses.");
    },function(){ window.prompt("Copy these addresses:",text); });
  });
  document.getElementById("clear").addEventListener("click",function(){
    if (!pins.length) return;
    if (confirm("Delete all "+pins.length+" pins? Export first if you need them.")){
      Object.keys(markers).forEach(function(id){ map.removeLayer(markers[id]); });
      markers = {}; pins = []; clearPhotos(); save(); render();
    }
  });

  // Boot
  Promise.all(pins.filter(function(p){return p.hasPhoto;}).map(function(p){
    return getPhoto(p.id).then(function(b){ if (b && b.size) photoURLs[p.id] = URL.createObjectURL(b); });
  })).then(function(){ render(); });
  pins.forEach(function(p){ addMarker(p); if (!p.address) geocode(p); });
  renderTrack(); holdScreen();
  var allPts = fitAll();
  if (allPts.length) map.fitBounds(L.latLngBounds(allPts),{maxZoom:17,padding:[30,30]});
  render();
  setTimeout(function(){ map.invalidateSize(); },300);
})();
</script>
</body>
</html>
